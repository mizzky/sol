services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/sol_coffeesys:cached
      # codexのタスク履歴をdevcontainerリビルドしても維持する
      - codex-data:/home/vscode/.codex
      # ホストのSSHエージェントを共有し、秘密鍵をコピーせずにGit認証する
      - type: bind
        source: ${SSH_AUTH_SOCK:?ホストでssh-agentを起動してSSH_AUTH_SOCKを設定してください}
        target: /ssh-agent
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.ssh/known_hosts
        target: /etc/ssh/ssh_known_hosts
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.gitconfig
        target: /home/vscode/.gitconfig
        read_only: true
        bind:
          create_host_path: false
    environment:
      SSH_AUTH_SOCK: /ssh-agent
    network_mode: service:db # DBと同じネットワークを共有
    # 開発を止めないための設定
    command: sleep infinity
    env_file:
      - ../.env

  db:
    image: postgres:17-trixie # 最新のポスグレ
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: coffeesys_db
    ports:
      - "5432:5432"

volumes:
  codex-data:
    name: sol_coffeesys_codex_data
